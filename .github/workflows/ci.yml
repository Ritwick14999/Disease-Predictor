name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Check style and imports
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run the test suite
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      # The real dataset is not in the repository, so CI exercises the whole
      # path on generated data: audit -> train -> serve -> predict.
      - name: Audit the dataset for duplicate rows
        run: dp audit --synthetic
      - name: Train and write reports
        run: dp train --synthetic --model xgboost --folds 3
      - name: Predict from the trained bundle
        run: dp predict --json $(dp symptoms --limit 3 2>/dev/null | tr '\n' ' ')
      - name: Smoke-test the API
        run: |
          dp serve --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d "{\"symptoms\": $(dp symptoms --limit 3 2>/dev/null | python -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')}" \
            | grep -q '"predictions"'
      - name: Upload the training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: reports/
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t disease-predictor:ci .
      - name: Check the container serves predictions
        run: |
          docker run -d --name dp -p 8000:8000 disease-predictor:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"model_loaded":true'
          docker rm -f dp
