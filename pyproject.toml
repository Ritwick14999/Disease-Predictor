[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disease-predictor"
dynamic = ["version"]
description = "Leakage-aware symptom-to-diagnosis ranking: training pipeline, REST API and UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["machine-learning", "healthcare", "classification", "mlops", "explainability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
imbalance = ["imbalanced-learn>=0.11"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
ui = ["streamlit>=1.30", "matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "httpx>=0.27",
]
all = [
    "disease-predictor[xgboost,imbalance,api,ui,dev]",
]

[project.scripts]
dp = "disease_predictor.cli:main"

[project.urls]
Repository = "https://github.com/Ritwick14999/Disease-Predictor"
Issues = "https://github.com/Ritwick14999/Disease-Predictor/issues"

[tool.setuptools.dynamic]
version = { attr = "disease_predictor.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that train a model end to end",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["disease_predictor"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "N818",    # existing exception names read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are injected by name and are not always referenced in the body.
"tests/*" = ["ARG001", "ARG002"]
# scikit-learn's estimator API mandates the capital-X signature.
"src/disease_predictor/models.py" = ["N803", "N806"]
# FastAPI passes `app` into the lifespan handler whether or not it is used.
"src/disease_predictor/api.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["disease_predictor"]
